<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" font-family="Menlo, Consolas, monospace" role="img" aria-label="Databricks Delta tables connect over JDBC with OAuth M2M to the ScriptedSQL connector inside IDM; IDM exposes REST routes; the test suite asserts via IDM REST and verifies out-of-band via the Databricks SQL REST API.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e8f"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d0803c"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8b949e" stroke-width="1.3">
    <rect x="20" y="40" width="250" height="170" rx="6" stroke="#2f9e8f"/>
    <rect x="36" y="80" width="218" height="34" rx="3"/>
    <rect x="36" y="122" width="218" height="34" rx="3"/>
    <rect x="36" y="164" width="218" height="30" rx="3" stroke-dasharray="4 3"/>
    <line x1="270" y1="110" x2="392" y2="110" stroke="#2f9e8f" stroke-width="1.6" marker-end="url(#arrT)" marker-start="url(#arrT)"/>
    <rect x="392" y="40" width="290" height="170" rx="6" stroke="#d0803c"/>
    <rect x="408" y="80" width="258" height="76" rx="3"/>
    <rect x="408" y="166" width="258" height="28" rx="3" stroke-dasharray="4 3"/>
    <line x1="682" y1="110" x2="790" y2="110" stroke="#d0803c" stroke-width="1.6" marker-end="url(#arrA)"/>
    <rect x="790" y="76" width="170" height="68" rx="6"/>
    <rect x="392" y="258" width="290" height="52" rx="6"/>
    <line x1="537" y1="258" x2="537" y2="212" stroke="#d0803c" stroke-width="1.5" marker-end="url(#arrA)"/>
    <path d="M 392 284 L 145 284 L 145 212" stroke="#2f9e8f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrT)"/>
  </g>
  <g fill="#8b949e" font-size="12">
    <text x="36" y="66" fill="#2f9e8f" font-weight="bold" font-size="13" font-family="Helvetica, Arial, sans-serif">Databricks (Free Edition)</text>
    <text x="46" y="101">idm_lab.business_records</text>
    <text x="46" y="143">idm_lab.outbound_records</text>
    <text x="46" y="183" font-size="11.5">Change Data Feed (commit log)</text>
    <text x="331" y="94" fill="#2f9e8f" font-size="11.5" text-anchor="middle">JDBC 2.7.3</text>
    <text x="331" y="132" fill="#d0803c" font-size="11.5" text-anchor="middle">OAuth M2M (SP)</text>
    <text x="408" y="66" fill="#d0803c" font-weight="bold" font-size="13" font-family="Helvetica, Arial, sans-serif">PingIDM 8.1.1 (stands in for AIC)</text>
    <text x="420" y="100" font-weight="bold" font-family="Helvetica, Arial, sans-serif">ScriptedSQL connector</text>
    <text x="420" y="118" font-size="11">8 Groovy scripts &#183; 1 provisioner</text>
    <text x="420" y="134" font-size="11">businessRecord &#183; outboundRecord</text>
    <text x="420" y="150" font-size="11">sync token = CDF _commit_version</text>
    <text x="420" y="184" font-size="11.5">DS 8.1.1 repo (localhost:31389)</text>
    <text x="736" y="96" fill="#d0803c" font-size="11.5" text-anchor="middle">REST :8443</text>
    <text x="806" y="100" font-weight="bold" font-size="12.5" font-family="Helvetica, Arial, sans-serif">Consumers</text>
    <text x="806" y="118" font-size="11">/system/databricks/&#8230;</text>
    <text x="806" y="134" font-size="11" font-family="Helvetica, Arial, sans-serif">mappings &amp; recon (next)</text>
    <text x="408" y="280" font-weight="bold" font-size="12.5" font-family="Helvetica, Arial, sans-serif">Node/Vitest acceptance suite</text>
    <text x="408" y="297" font-size="11">test/ &#183; PROFILE=lab|tenant &#183; evidence logs</text>
    <text x="548" y="240" fill="#d0803c" font-size="11">asserts via IDM REST</text>
    <text x="160" y="276" fill="#2f9e8f" font-size="11">verifies out-of-band &#183; SQL REST API</text>
  </g>
</svg>
