# Two RCS pods in client mode, connecting out to IDM on the Mac. Each pod is a
# named connector server (rcs0, rcs1); IDM puts both in one failover group.
# Written for this repo. The Secret "rcs-idm-credentials" is created by
# rcs/k8s/deploy.sh from secrets/rcs.env — never committed.
apiVersion: v1
kind: Namespace
metadata:
  name: dbx-aic-lab
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rcs
  namespace: dbx-aic-lab
spec:
  serviceName: rcs          # client mode: no inbound traffic, so no Service object
  replicas: 2
  selector:
    matchLabels: { app: rcs }
  template:
    metadata:
      labels: { app: rcs }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 11111
        runAsGroup: 0
        fsGroup: 11111          # Secret files get this group, so the pod can read them
      containers:
        - name: rcs
          image: dbx-aic-lab-rcs:dev
          imagePullPolicy: Never      # built inside the minikube node by build.sh
          # Connector server name from the pod name: rcs-0 -> rcs0 (names must
          # match ^[a-z0-9]*$). Then the image's own entrypoint, unchanged.
          command: ["/bin/sh", "-c"]
          args:
            - n=$$(hostname);
              export OPENICF_OPTS="$OPENICF_OPTS -Dconnectorserver.connectorServerName=${n%%-*}${n##*-}";
              exec /opt/openicf/bin/docker-entrypoint.sh
          env:
            # JDK @argfile with -Dconnectorserver.principal/password: keeps the
            # credentials out of the process list and out of env vars.
            - name: OPENICF_OPTS
              value: "@/var/run/rcs-credentials/credentials.args"
            # Port the RCS dials (connectorserver.url): 8443 in the lab, 443 for AIC.
            - name: RCS_UPSTREAM_PORT
              value: "8443"
          # Client mode opens no port and has no health endpoint, so the probes
          # check for an ESTABLISHED socket to the upstream port (state 01 in
          # /proc/net/tcp*). Liveness is slow on purpose: the RCS reconnects on
          # its own (newConnectionsInterval=10), and an upstream outage must not
          # restart-loop every pod.
          startupProbe:
            exec: &upstream-connected
              command:
                - /bin/sh
                - -c
                - awk -v p="$(printf ':%04X' "$RCS_UPSTREAM_PORT")"
                  'FNR>1 && $4=="01" && substr($3, length($3)-4)==p {f=1} END {exit !f}'
                  /proc/net/tcp /proc/net/tcp6
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec: *upstream-connected
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            exec: *upstream-connected
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: idm-credentials
              mountPath: /var/run/rcs-credentials
              readOnly: true
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: idm-credentials
          secret:
            secretName: rcs-idm-credentials
            defaultMode: 0440         # owner + fsGroup read only
---
# Keep one RCS connected during voluntary disruptions (node drain, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rcs
  namespace: dbx-aic-lab
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: rcs }
