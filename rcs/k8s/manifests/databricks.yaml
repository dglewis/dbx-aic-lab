# The Databricks RCS cluster (ADR-003: one RCS cluster per external system):
# two pods in client mode, connecting out to IDM on the Mac. Each pod is a
# named connector server (databricks0, databricks1) with its own login; IDM
# puts both in the failover group "databricks".
# Written for this repo. The Secret "databricks-rcs-credentials" (one JDK
# @argfile per server) is created by rcs/k8s/deploy.sh from secrets/rcs.env —
# never committed.
apiVersion: v1
kind: Namespace
metadata:
  name: dbx-aic-lab
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: databricks
  namespace: dbx-aic-lab
spec:
  serviceName: databricks   # client mode: no inbound traffic, so no Service object
  replicas: 2
  selector:
    matchLabels: { app: databricks-rcs }
  template:
    metadata:
      labels: { app: databricks-rcs }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 11111
        runAsGroup: 0
        fsGroup: 11111          # Secret files get this group, so the pod can read them
      containers:
        - name: rcs
          image: databricks-rcs:dev
          imagePullPolicy: Never      # built inside the minikube node by build.sh
          # Connector server name from the pod name: databricks-0 ->
          # databricks0 (names must match ^[a-z0-9]*$). Its own login comes
          # from a JDK @argfile (-Dconnectorserver.principal/password) named
          # after it — out of the process list and env vars. Then the image's
          # own entrypoint, unchanged.
          command: ["/bin/sh", "-c"]
          args:
            - n=$$(hostname); s=${n%%-*}${n##*-};
              export OPENICF_OPTS="@/var/run/rcs-credentials/$s.args -Dconnectorserver.connectorServerName=$s";
              exec /opt/openicf/bin/docker-entrypoint.sh
          env:
            # Port the RCS dials (connectorserver.url): 8443 in the lab, 443 for AIC.
            - name: RCS_UPSTREAM_PORT
              value: "8443"
          # Client mode opens no port and has no health endpoint, so the probes
          # check for an ESTABLISHED socket to the upstream port (state 01 in
          # /proc/net/tcp*). Liveness is slow on purpose: the RCS reconnects on
          # its own (newConnectionsInterval=10), and an upstream outage must not
          # restart-loop every pod.
          startupProbe:
            exec: &upstream-connected
              command:
                - /bin/sh
                - -c
                - awk -v p="$(printf ':%04X' "$RCS_UPSTREAM_PORT")"
                  'FNR>1 && $4=="01" && substr($3, length($3)-4)==p {f=1} END {exit !f}'
                  /proc/net/tcp /proc/net/tcp6
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec: *upstream-connected
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            exec: *upstream-connected
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: idm-credentials
              mountPath: /var/run/rcs-credentials
              readOnly: true
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: idm-credentials
          secret:
            secretName: databricks-rcs-credentials
            defaultMode: 0440         # owner + fsGroup read only
---
# Keep one RCS connected during voluntary disruptions (node drain, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: databricks
  namespace: dbx-aic-lab
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: databricks-rcs }
