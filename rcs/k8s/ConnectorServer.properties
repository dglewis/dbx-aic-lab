# Java RCS in a pod — client mode, connecting out to IDM on the Mac.
# Written for this lab from the public "Configure RCS" documentation.
# Credentials are not here: the pod mounts them as a JDK @argfile from a
# Kubernetes Secret, referenced by OPENICF_OPTS (see manifests/databricks.yaml).
connectorserver.url=wss://host.minikube.internal:8443/openicf
# connectorServerName is not set here: each pod passes its own (databricks0,
# databricks1 — from its pod name, as names must match ^[a-z0-9]*$) with -D;
# see manifests/databricks.yaml.

connectorserver.pingPongInterval=60
connectorserver.housekeepingInterval=20
connectorserver.groupCheckInterval=60
connectorserver.webSocketConnections=2
connectorserver.connectionTtl=300
connectorserver.newConnectionsInterval=10

connectorserver.trustStoreFile=security/truststore
connectorserver.trustStoreType=PKCS12
connectorserver.trustStorePass=changeit

connectorserver.bundleDir=connectors
connectorserver.libDir=lib
connectorserver.loggerClass=org.forgerock.openicf.common.logging.slf4j.SLF4JLog
