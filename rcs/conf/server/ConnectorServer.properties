# Java RCS — server mode (topology T1: IDM connects to the RCS on 8759).
# Stepping stone only: AIC does not support server mode. The target is
# client mode (rcs/conf/client/).
# Written for this lab from the public "Configure RCS" documentation; not
# derived from the distribution's file. `rcs/deploy.sh server` copies this over
# rcs/openicf/conf/ConnectorServer.properties and then sets
# connectorserver.key with `ConnectorServer.sh /setKey` (the key is stored
# hashed; it cannot be written here directly).

connectorserver.port=8759
# Lab-only plaintext link to localhost. TLS is a later G1 step: the
# connector configuration (incl. the Databricks SP secret) crosses this link.
connectorserver.usessl=false

connectorserver.bundleDir=connectors
connectorserver.libDir=lib
connectorserver.loggerClass=org.forgerock.openicf.common.logging.slf4j.SLF4JLog
