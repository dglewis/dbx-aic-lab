# Java RCS — client mode (topology T2: the RCS connects out to IDM).
# Client mode is the target: AIC supports only client mode. Written for this
# lab from the public "Configure RCS" documentation; not derived from the
# distribution's file. `rcs/deploy.sh client` copies it over
# rcs/openicf/conf/ConnectorServer.properties.
#
# Secrets are not in this file: rcs/run.sh passes
# -Dconnectorserver.principal / -Dconnectorserver.password (IDM credentials,
# from secrets/rcs.env) through OPENICF_OPTS; -D values override this file.

# IDM's ICF websocket endpoint (self-hosted IDM, no AM: basic credentials).
connectorserver.url=wss://localhost:8443/openicf
# Must match the remoteConnectorClients "name" in IDM (and connectorHostRef).
connectorserver.connectorServerName=rcslocal

connectorserver.pingPongInterval=60
connectorserver.housekeepingInterval=20
connectorserver.groupCheckInterval=60
connectorserver.webSocketConnections=2
connectorserver.connectionTtl=300
connectorserver.newConnectionsInterval=10

# The distribution's truststore (public CAs, needed by the Databricks driver)
# plus IDM's self-signed certificate, imported by rcs/deploy.sh. The RCS sets
# the JVM-wide javax.net.ssl.trustStore from these, so this one store must
# serve both IDM and Databricks.
connectorserver.trustStoreFile=security/truststore
connectorserver.trustStoreType=PKCS12
connectorserver.trustStorePass=changeit

connectorserver.bundleDir=connectors
connectorserver.libDir=lib
connectorserver.loggerClass=org.forgerock.openicf.common.logging.slf4j.SLF4JLog
